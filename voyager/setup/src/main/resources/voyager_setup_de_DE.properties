# Messages of the setup server, German (informal "du"). Same keys, order and <arg:N> placeholders as
# voyager_setup_en_US.properties; MessageBundleParityTest refuses a mismatch. Never {N}: see docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> ist kein Map-Name. Nutze Kleinbuchstaben, Ziffern, '-' und '_', beginne mit einem Buchstaben oder einer Ziffer und bleib bei höchstens 32 Zeichen.
voyager.setup.map.created=<c-dim>Map <arg:0> ist angelegt. Stell dich dorthin, wo die Racer starten, und führe /map spawn aus.
voyager.setup.map.exists=<c-dim>Ein Entwurf oder eine Welt namens <arg:0> existiert schon. Nichts wurde geändert.
voyager.setup.map.opened=<c-dim>Map <arg:0> ist geöffnet, mit <arg:1> Ringen.
voyager.setup.map.none=<c-dim>Keine Map ist geöffnet. Führe /map new <id> oder /map open <id> aus.
voyager.setup.refused=<c-warn>Abgelehnt: <arg:0>
voyager.setup.player.only=<c-dim>Nur ein Spieler kann eine Map bauen.
voyager.setup.wand.given.place=<c-dim>Du hast den Setup-Stab. Rechtsklick setzt einen Ring dorthin, wo du stehst, in Flugrichtung.
voyager.setup.wand.given.remove=<c-dim>Linksklick entfernt den Ring, durch den du schaust.
voyager.setup.spawn.saved=<c-dim>Spawn gespeichert bei <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=<c-dim>Stell dich in die offene Map, um ihren Spawn zu setzen.
voyager.setup.save.failed=<c-warn>Die Änderung wurde nicht gespeichert. Der Entwurf <arg:0> ist unverändert.
voyager.setup.status.spawn.set=<c-dim>Spawn: gesetzt
voyager.setup.status.spawn.unset=<c-dim>Spawn: nicht gesetzt
voyager.setup.status.rings=<c-dim>Ringe: <arg:0>
voyager.setup.status.problem.spawn=<c-dim>Blockiert: Es ist kein Spawn gesetzt.
voyager.setup.status.problem.rings=<c-dim>Blockiert: Die Map hat keinen Ring.
voyager.setup.ring.placed=<c-dim>Ring <arg:0> ist gesetzt.
voyager.setup.ring.pose.refused=<c-dim>Kein Ring gesetzt: Die Blickrichtung hat keine Länge.
voyager.setup.ring.removed=<c-dim>Ring <arg:0> ist entfernt. Die Ringe danach werden neu nummeriert.
voyager.setup.ring.none=<c-caution>Kein Ring in Reichweite deines Blicks. Nichts wurde entfernt.
voyager.setup.undo.done=<c-dim>Rückgängig gemacht. Der Entwurf hat jetzt <arg:0> Ringe.
voyager.setup.undo.none=<c-caution>Nichts zum Rückgängigmachen in dieser Map. Nur eine Änderung seit dem Öffnen kann zurückgenommen werden.
voyager.setup.redo.done=<c-dim>Wiederhergestellt. Der Entwurf hat jetzt <arg:0> Ringe.
voyager.setup.redo.none=<c-caution>Nichts zum Wiederherstellen. Nur was /map undo zurückgenommen hat, lässt sich wiederherstellen.
voyager.command.denied=<c-warn>Du darfst diesen Befehl nicht ausführen
voyager.setup.import.started=<c-dim>Ich importiere <arg:0> in die Map <arg:1>. Die Kopie läuft im Hintergrund, der Server läuft weiter.
voyager.setup.import.done=<c-dim>Map <arg:0> ist importiert: <arg:1> Region-Dateien, <arg:2> Bytes. Als Nächstes: /map open <arg:0>.
voyager.setup.import.failed=<c-warn>Der Import von <arg:0> ist fehlgeschlagen, es wurde nichts behalten: <arg:1>
voyager.setup.import.busy=<c-caution>Ein Import von <arg:0> läuft schon. Es wurde nichts geändert.
voyager.setup.import.root.missing=<c-caution>Der Import-Ordner <arg:0> existiert nicht. Lege ihn an oder setze VOYAGER_IMPORT_PATH. Es wurde nichts geändert.
voyager.setup.import.folder.invalid=<c-caution>'<arg:0>' ist im Import-Ordner kein gültiger Weltordner-Name.
voyager.setup.import.folder.missing=<c-caution>Der Weltordner <arg:0> existiert nicht.
voyager.setup.import.layout.unsupported=<c-caution>Es wurden keine Region-Dateien gefunden. Leg sie in region/ oder in dimensions/minecraft/overworld/region/ des Weltordners ab.
voyager.setup.import.layout.ambiguous=<c-caution>Region-Dateien wurden in <arg:0> und in <arg:1> gefunden. Behalte nur einen der beiden Ordner.
voyager.setup.import.link.refused=<c-caution>Die Region-Datei <arg:0> ist ein Link. Kopiere die Dateien der Welt statt eines Links und importiere dann erneut.
voyager.setup.import.too.large=<c-caution>Der Import ist zu groß: <arg:0> bei dem Limit <arg:1>, das <arg:2> setzt.
voyager.setup.import.dataversion.newer=<c-caution>Die Welt hat die Datenversion <arg:0>, dieser Server liest bis <arg:1>. Es wurde nichts behalten.
voyager.setup.import.spawn.found=<c-dim>Die Welt nennt ihren Spawn bei <arg:0>, <arg:1>, <arg:2> (aus <arg:3>).
voyager.setup.import.spawn.none=<c-dim>Die Welt nennt keinen Spawn, deshalb ist keiner gesetzt. Stell dich an den Start und führe /map spawn aus.
voyager.setup.import.spawn.hint=<c-caution>Der Spawn bei <arg:0>, <arg:1>, <arg:2> sieht nach einem Standardwert aus: Prüf ihn mit /map spawn.
voyager.setup.import.census=<c-dim>Chunks: <arg:0> fertig, <arg:1> unvollständig, <arg:2> ohne Status, <arg:3> nicht lesbar.
voyager.setup.import.partial.warning=<c-caution>Warnung: <arg:0> Chunks (<arg:1> Prozent der Chunk-Einträge) sind unvollständig. Ihre Erzeugung ist nicht fertig, dort können Lücken sein. Der Import wurde behalten.
voyager.setup.import.dimensions.ignored=<c-dim>Andere Dimensionen wurden ignoriert: <arg:0>.
