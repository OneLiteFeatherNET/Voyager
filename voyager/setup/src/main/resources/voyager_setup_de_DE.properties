# Messages of the setup server, German (informal "du"). Same keys, order and <arg:N> placeholders as
# voyager_setup_en_US.properties; MessageBundleParityTest refuses a mismatch. Never {N}: see docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> ist kein Map-Name. Nutze Kleinbuchstaben, Ziffern, '-' und '_', beginne mit einem Buchstaben oder einer Ziffer und bleib bei höchstens 32 Zeichen.
voyager.setup.map.created=Map <arg:0> ist angelegt. Stell dich dorthin, wo die Racer starten, und führe /map spawn aus.
voyager.setup.map.exists=Ein Entwurf oder eine Welt namens <arg:0> existiert schon. Nichts wurde geändert.
voyager.setup.map.opened=Map <arg:0> ist geöffnet, mit <arg:1> Ringen.
voyager.setup.map.none=Keine Map ist geöffnet. Führe /map new <id> oder /map open <id> aus.
voyager.setup.refused=Abgelehnt: <arg:0>
voyager.setup.player.only=Nur ein Spieler kann eine Map bauen.
voyager.setup.wand.given=Du hast den Setup-Stab. Rechtsklick setzt einen Ring dorthin, wo du stehst, in Flugrichtung; Linksklick entfernt den Ring, durch den du schaust.
voyager.setup.spawn.saved=Spawn gespeichert bei <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=Stell dich in die offene Map, um ihren Spawn zu setzen.
voyager.setup.save.failed=Die Änderung wurde nicht gespeichert. Der Entwurf <arg:0> ist unverändert.
voyager.setup.status.spawn.set=Spawn: gesetzt
voyager.setup.status.spawn.unset=Spawn: nicht gesetzt
voyager.setup.status.rings=Ringe: <arg:0>
voyager.setup.status.problem.spawn=Blockiert: Es ist kein Spawn gesetzt.
voyager.setup.status.problem.rings=Blockiert: Die Map hat keinen Ring.
voyager.setup.ring.placed=Ring <arg:0> ist gesetzt.
voyager.setup.ring.pose.refused=Kein Ring gesetzt: Die Blickrichtung hat keine Länge.
voyager.setup.ring.removed=Ring <arg:0> ist entfernt. Die Ringe danach werden neu nummeriert.
voyager.setup.ring.none=Kein Ring in Reichweite deines Blicks. Nichts wurde entfernt.
voyager.command.denied=Du darfst diesen Befehl nicht ausführen
