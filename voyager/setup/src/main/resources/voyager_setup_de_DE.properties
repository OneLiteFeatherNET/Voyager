# Messages of the setup server, German (informal "du"). Same keys, order and <arg:N> placeholders as
# voyager_setup_en_US.properties; MessageBundleParityTest refuses a mismatch. Never {N}: see docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> ist kein Map-Name. Nutze Kleinbuchstaben, Ziffern, '-' und '_', beginne mit einem Buchstaben oder einer Ziffer und bleib bei höchstens 32 Zeichen.
voyager.setup.map.created=<c-dim>Map <arg:0> ist angelegt. Stell dich dorthin, wo die Racer starten, und führe /map spawn aus.
voyager.setup.map.exists=<c-dim>Ein Entwurf oder eine Welt namens <arg:0> existiert schon. Nichts wurde geändert.
voyager.setup.map.opened=<c-dim>Map <arg:0> ist geöffnet, mit <arg:1> Ringen.
voyager.setup.map.none=<c-dim>Keine Map ist geöffnet. Führe /map new <id> oder /map open <id> aus.
voyager.setup.refused=<c-warn>Abgelehnt: <arg:0>
voyager.setup.player.only=<c-dim>Nur ein Spieler kann eine Map bauen.
voyager.setup.wand.given.place=<c-dim>Du hast den Setup-Stab. Rechtsklick setzt einen Ring dorthin, wo du stehst, in Flugrichtung.
voyager.setup.wand.given.remove=<c-dim>Linksklick entfernt den Ring, durch den du schaust.
voyager.setup.spawn.saved=<c-dim>Spawn gespeichert bei <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=<c-dim>Stell dich in die offene Map, um ihren Spawn zu setzen.
voyager.setup.save.failed=<c-warn>Die Änderung wurde nicht gespeichert. Der Entwurf <arg:0> ist unverändert.
voyager.setup.status.spawn.set=<c-dim>Spawn: gesetzt
voyager.setup.status.spawn.unset=<c-dim>Spawn: nicht gesetzt
voyager.setup.status.rings=<c-dim>Ringe: <arg:0>
voyager.setup.status.problem.spawn=<c-dim>Blockiert: Es ist kein Spawn gesetzt.
voyager.setup.status.problem.rings=<c-dim>Blockiert: Die Map hat keinen Ring.
voyager.setup.ring.placed=<c-dim>Ring <arg:0> ist gesetzt.
voyager.setup.ring.pose.refused=<c-dim>Kein Ring gesetzt: Die Blickrichtung hat keine Länge.
voyager.setup.ring.removed=<c-dim>Ring <arg:0> ist entfernt. Die Ringe danach werden neu nummeriert.
voyager.setup.ring.none=<c-caution>Kein Ring in Reichweite deines Blicks. Nichts wurde entfernt.
voyager.command.denied=<c-warn>Du darfst diesen Befehl nicht ausführen
