# Messages of the setup server. Placeholders are MiniMessage <arg:N>, never {N}: see
# docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> is not a map name. Use lower-case letters, digits, '-' and '_', start with a letter or digit, and keep it to 32 characters.
voyager.setup.map.created=<c-dim>Map <arg:0> is created. Stand where the racers start and run /map spawn.
voyager.setup.map.exists=<c-dim>A draft or a world named <arg:0> already exists. Nothing was changed.
voyager.setup.map.opened=<c-dim>Map <arg:0> is open with <arg:1> rings.
voyager.setup.map.none=<c-dim>No map is open. Run /map new <id> or /map open <id>.
voyager.setup.refused=<c-warn>Refused: <arg:0>
voyager.setup.player.only=<c-dim>Only a player can build a map.
voyager.setup.wand.given.place=<c-dim>You hold the setup wand. Right-click places a ring where you stand, facing the flight.
voyager.setup.wand.given.remove=<c-dim>Left-click removes the ring you look through.
voyager.setup.spawn.saved=<c-dim>Spawn saved at <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=<c-dim>Stand in the open map to set its spawn.
voyager.setup.save.failed=<c-warn>The change was not saved. The draft <arg:0> is as it was before.
voyager.setup.status.spawn.set=<c-dim>Spawn: set
voyager.setup.status.spawn.unset=<c-dim>Spawn: not set
voyager.setup.status.rings=<c-dim>Rings: <arg:0>
voyager.setup.status.problem.spawn=<c-dim>Blocking: no spawn is set.
voyager.setup.status.problem.rings=<c-dim>Blocking: the map has no ring.
voyager.setup.ring.placed=<c-dim>Ring <arg:0> is placed.
voyager.setup.ring.pose.refused=<c-dim>No ring was placed: the look direction has no length.
voyager.setup.ring.removed=<c-dim>Ring <arg:0> is removed. The rings after it are renumbered.
voyager.setup.ring.none=<c-caution>No ring is in reach along your look. Nothing was removed.
voyager.command.denied=<c-warn>You may not run this command
