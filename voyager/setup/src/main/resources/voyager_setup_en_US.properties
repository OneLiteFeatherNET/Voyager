# Messages of the setup server. Placeholders are MiniMessage <arg:N>, never {N}: see
# docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> is not a map name. Use lower-case letters, digits, '-' and '_', start with a letter or digit, and keep it to 32 characters.
voyager.setup.map.created=<c-dim>Map <arg:0> is created. Stand where the racers start and run /map spawn.
voyager.setup.map.exists=<c-dim>A draft or a world named <arg:0> already exists. Nothing was changed.
voyager.setup.map.opened=<c-dim>Map <arg:0> is open with <arg:1> rings.
voyager.setup.map.none=<c-dim>No map is open. Run /map new <id> or /map open <id>.
voyager.setup.refused=<c-warn>Refused: <arg:0>
voyager.setup.player.only=<c-dim>Only a player can build a map.
voyager.setup.wand.given.place=<c-dim>You hold the setup wand. Right-click places a ring where you stand, facing the flight.
voyager.setup.wand.given.remove=<c-dim>Left-click removes the ring you look through.
voyager.setup.spawn.saved=<c-dim>Spawn saved at <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=<c-dim>Stand in the open map to set its spawn.
voyager.setup.save.failed=<c-warn>The change was not saved. The draft <arg:0> is as it was before.
voyager.setup.status.spawn.set=<c-dim>Spawn: set
voyager.setup.status.spawn.unset=<c-dim>Spawn: not set
voyager.setup.status.rings=<c-dim>Rings: <arg:0>
voyager.setup.status.problem.spawn=<c-dim>Blocking: no spawn is set.
voyager.setup.status.problem.rings=<c-dim>Blocking: the map has no ring.
voyager.setup.ring.placed=<c-dim>Ring <arg:0> is placed.
voyager.setup.ring.pose.refused=<c-dim>No ring was placed: the look direction has no length.
voyager.setup.ring.removed=<c-dim>Ring <arg:0> is removed. The rings after it are renumbered.
voyager.setup.ring.none=<c-caution>No ring is in reach along your look. Nothing was removed.
voyager.setup.claim.held=<c-warn>Map <arg:0> is open for <arg:1>. Ask that builder to run /map close first.
voyager.setup.map.closed=<c-dim>Map <arg:0> is closed. Its previews are removed, and another builder can open it.
voyager.setup.map.unlocked=<c-dim>The claim of <arg:0>, held by <arg:1>, is released. Their open session on that map has ended.
voyager.setup.map.unheld=<c-dim>No builder holds <arg:0>. Nothing was changed.
voyager.setup.save.changed=<c-warn>The change was not saved. The draft <arg:0> changed on disk, so the stored copy is kept. Run /map close, then /map open <arg:0>.
voyager.command.denied=<c-warn>You may not run this command
voyager.setup.import.started=<c-dim>Importing <arg:0> into map <arg:1>. The copy runs in the background; the server keeps running.
voyager.setup.import.done=<c-dim>Map <arg:0> is imported: <arg:1> region files, <arg:2> bytes. Next: /map open <arg:0>.
voyager.setup.import.failed=<c-warn>The import of <arg:0> failed, and nothing was kept: <arg:1>
voyager.setup.import.busy=<c-caution>An import of <arg:0> is already running. Nothing was changed.
voyager.setup.import.root.missing=<c-caution>The import folder <arg:0> does not exist. Create it, or set VOYAGER_IMPORT_PATH. Nothing was changed.
voyager.setup.import.folder.invalid=<c-caution>'<arg:0>' is not a world folder name in the import folder.
voyager.setup.import.folder.missing=<c-caution>The world folder <arg:0> does not exist.
voyager.setup.import.layout.unsupported=<c-caution>No region files were found. Put them in region/ or in dimensions/minecraft/overworld/region/ of the world folder.
voyager.setup.import.layout.ambiguous=<c-caution>Region files were found in both <arg:0> and <arg:1>. Keep only one of the two folders.
voyager.setup.import.link.refused=<c-caution>The region file <arg:0> is a link. Copy the world's files, not a link, and import again.
voyager.setup.import.too.large=<c-caution>The import is too large: <arg:0> against the limit <arg:1> that <arg:2> sets.
voyager.setup.import.dataversion.newer=<c-caution>The world has data version <arg:0>, and this server reads up to <arg:1>. Nothing was kept.
voyager.setup.import.spawn.found=<c-dim>The world states its spawn at <arg:0>, <arg:1>, <arg:2> (from <arg:3>).
voyager.setup.import.spawn.none=<c-dim>The world states no spawn, so none is set. Stand at the start and run /map spawn.
voyager.setup.import.spawn.hint=<c-caution>The spawn at <arg:0>, <arg:1>, <arg:2> looks like a default: check it with /map spawn.
voyager.setup.import.census=<c-dim>Chunks: <arg:0> full, <arg:1> partial, <arg:2> without status, <arg:3> unreadable.
voyager.setup.import.partial.warning=<c-caution>Warning: <arg:0> chunks (<arg:1> percent of the chunk records) are partial. Their generation did not finish, so they may show holes. The import was kept.
voyager.setup.import.dimensions.ignored=<c-dim>Other dimensions were ignored: <arg:0>.
