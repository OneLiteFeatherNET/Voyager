# Messages of the setup server. Placeholders are MiniMessage <arg:N>, never {N}: see
# docs/guides/how-to-add-a-translation.md.
voyager.setup.id.invalid=<arg:0> is not a map name. Use lower-case letters, digits, '-' and '_', start with a letter or digit, and keep it to 32 characters.
voyager.setup.map.created=Map <arg:0> is created. Stand where the racers start and run /map spawn.
voyager.setup.map.exists=A draft or a world named <arg:0> already exists. Nothing was changed.
voyager.setup.map.opened=Map <arg:0> is open with <arg:1> rings.
voyager.setup.map.none=No map is open. Run /map new <id> or /map open <id>.
voyager.setup.refused=Refused: <arg:0>
voyager.setup.player.only=Only a player can build a map.
voyager.setup.wand.given=You hold the setup wand. Right-click places a ring where you stand, looking along the flight; left-click removes the ring you look through.
voyager.setup.spawn.saved=Spawn saved at <arg:0>, <arg:1>, <arg:2>.
voyager.setup.spawn.elsewhere=Stand in the open map to set its spawn.
voyager.setup.save.failed=The change was not saved. The draft <arg:0> is as it was before.
voyager.setup.status.spawn.set=Spawn: set
voyager.setup.status.spawn.unset=Spawn: not set
voyager.setup.status.rings=Rings: <arg:0>
voyager.setup.status.problem.spawn=Blocking: no spawn is set.
voyager.setup.status.problem.rings=Blocking: the map has no ring.
voyager.setup.ring.placed=Ring <arg:0> is placed.
voyager.setup.ring.pose.refused=No ring was placed: the look direction has no length.
voyager.setup.ring.removed=Ring <arg:0> is removed. The rings after it are renumbered.
voyager.setup.ring.none=No ring is in reach along your look. Nothing was removed.
