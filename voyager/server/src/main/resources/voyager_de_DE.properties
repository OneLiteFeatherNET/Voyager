# Voyager — the German message bundle (informal "du").
#
# Same keys, same order and the same <arg:N> and palette tags as voyager_en_US.properties. The build's parity test
# (MessageBundleParityTest) refuses a key that is missing, extra or different in its placeholders. A German line may
# be reworded freely otherwise. Never write {N} (MessageFormat), and never a hex colour: colours are palette tags.
# Numbers keep "." as the decimal separator, like the English line and the logs.

