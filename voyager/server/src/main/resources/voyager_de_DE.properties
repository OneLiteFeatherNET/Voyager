# Voyager — the German message bundle (informal "du").
#
# Same keys, same order and the same <arg:N> and palette tags as voyager_en_US.properties. The build's parity test
# (MessageBundleParityTest) refuses a key that is missing, extra or different in its placeholders. A German line may
# be reworded freely otherwise. Never write {N} (MessageFormat), and never a hex colour: colours are palette tags.
# Numbers keep "." as the decimal separator, like the English line and the logs.

# --- The flight HUD ------------------------------------------------------------------------------
voyager.hud.flight=<c-dim><arg:0>   <arg:1>/<arg:2>   <arg:3>

voyager.hud.bossbar=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3> <arg:4>
voyager.hud.bossbar.last=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3>

# --- The start -----------------------------------------------------------------------------------
voyager.countdown.digit=<c-caution><arg:0>
voyager.countdown.subtitle=<c-dim><arg:0> · Ringe: <arg:1> · Ziel <arg:2>
voyager.countdown.go=<c-speed>GO
voyager.race.go.jump=<c-dim>Spring ab, dann Elytra öffnen.

# --- During a race -------------------------------------------------------------------------------
voyager.map.banner=<c-dim>» Map <c-value><arg:0><c-dim>/<arg:1> · <c-value><arg:2> <c-dim>— Ringe: <c-value><arg:3> <c-dim>· Ziel <c-value><arg:4>
voyager.race.finished=<c-ok><arg:0> in <arg:1> geschafft
voyager.race.joined.midcup=<c-dim>» Ein Cup läuft gerade. Du steigst mit der nächsten Map ein.
voyager.race.ring.missed=<c-warn>Ring <arg:0> verpasst
voyager.lobby.waiting=<c-dim>Warte auf Racer: <arg:0> von <arg:1> online
voyager.lobby.countdown=<c-caution>Cup startet in <arg:0> s
voyager.lobby.cancelled=<c-dim>» Start abgebrochen: <arg:0> von <arg:1> Racern online. Wir warten auf mehr.
voyager.lobby.player.join=<c-ok><arg:0> <c-dim>ist dem Rennen beigetreten (<arg:1>/<arg:2>)
voyager.lobby.player.joined.many=<c-ok><arg:0> <c-dim>Racer sind dem Rennen beigetreten (<arg:1>/<arg:2>)
voyager.lobby.bossbar.waiting.cup=<c-dim>Cup <c-value><arg:0> <c-dim>· warte auf Racer: <arg:1> von <arg:2> online
voyager.lobby.bossbar.countdown.cup=<c-dim>Cup <arg:0> <c-dim>· startet in <c-caution><arg:1> s
voyager.handoff.disconnect=<c-dim>Der Cup ist vorbei, und dieser Server kann dich nicht an den Netzwerk-Hub weiterreichen. Verbinde dich neu, um weiterzuspielen.
voyager.lobby.board.more=<c-dim>+<arg:0> weitere
voyager.reset.title.outofbounds=<c-warn>Außerhalb der Map
voyager.reset.title.landed=<c-warn>Gelandet
voyager.reset.target.checkpoint=<c-dim>zurück zu Checkpoint <c-value><arg:0>
voyager.reset.target.start=<c-dim>zurück zum Start

# --- When a map ends -----------------------------------------------------------------------------
voyager.result.map.medal=<c-dim><arg:0> — <c-value><arg:1> <c-dim>aus Ringen · <c-value><arg:2> <c-dim>für <arg:3> <c-dim>· <c-value><arg:4> <c-dim>für Platzierung = <c-value><arg:5>
voyager.result.map.dnf=<c-dim><arg:0> — <c-warn>DNF<c-dim>. <arg:1> von <arg:2> Ringen, <arg:3> Punkte.
voyager.result.map.subtitle.dnf=<c-value><arg:0> <c-dim>von <c-value><arg:1> <c-dim>Ringen
voyager.result.map.subtitle.next=<c-value><arg:0> <c-dim>s schneller für <arg:1>

# --- When the cup ends ---------------------------------------------------------------------------
voyager.result.cup.title=<c-speed>CUP BEENDET
voyager.result.cup.subtitle=<c-dim>Platz <c-value><arg:0>  <c-dim>·  <c-value><arg:1> <c-dim>Punkte
voyager.result.cup.heading=<c-dim>» <c-value><arg:0> <c-dim>— Endstand
voyager.result.cup.row=<c-dim>  <arg:0>  <c-value><arg:1>  <c-dim>·  <c-value><arg:2> <c-dim>Punkte  ·  <c-value><arg:3><c-dim>/<arg:4> Maps  ·  Bestzeit <c-value><arg:5>
voyager.result.cup.departed=<c-dim>(ausgetreten)
voyager.result.cup.notime=<c-dim>—

# --- Medals --------------------------------------------------------------------------------------
voyager.medal.diamond=<m-diamond>DIAMANT
voyager.medal.gold=<m-gold>GOLD
voyager.medal.silver=<m-silver>SILBER
voyager.medal.bronze=<m-bronze>BRONZE
voyager.medal.finish=<m-finish>ZIEL
voyager.medal.dnf=<c-warn>DNF

# --- Operator commands ---------------------------------------------------------------------------
voyager.command.restarted=<c-dim>Cup <c-value><arg:0> <c-dim>neu gestartet, Lobby übersprungen
voyager.command.skip.taken=<c-dim>Die laufende Map endet im nächsten Tick
voyager.command.skip.refused=<c-caution>Es läuft nichts. Ein Skip wird nicht für die nächste Map gespeichert.
voyager.command.reload.pending=<c-dim>Katalog neu geladen: die geänderten Maps und Cups gelten ab der nächsten Runde
voyager.command.reload.rejected=<c-dim>Reload abgelehnt, der laufende Katalog bleibt unverändert: <c-value><arg:0> <c-dim>Problem(e)
voyager.command.reload.failed=<c-warn>Reload fehlgeschlagen, siehe Server-Log. Der laufende Katalog bleibt unverändert.
voyager.command.reload.denied=<c-warn>Du darfst den Katalog nicht neu laden
voyager.command.denied=<c-warn>Du darfst diesen Befehl nicht ausführen
voyager.command.reload.problem=<c-dim><arg:0>
voyager.command.reload.warning=<c-dim>Warnung: <arg:0>
