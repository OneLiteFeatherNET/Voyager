# Voyager — the English message bundle.
#
# Placeholders are MiniMessage's <arg:0>, zero-indexed. NEVER MessageFormat's {0}: this project's
# translator has no MessageFormat path, so {0} renders as the three literal characters, in front of
# a player, forever. VoyagerTranslator refuses a value containing one at load.
#
# Colours are the palette tags <c-*> and <m-*>, defined once in Palette.java. Do not write a hex
# code here — a hex repeated across a bundle is a palette that has already drifted, and translating
# a line must not mean recolouring it.
#
# Red is not in the palette and must not be written here in any form. The course marks its own
# finish in red — ring 35 is the only one built from red concrete, red glazed terracotta and red
# nether bricks — and a racer learns that in one run at 33 blocks a second. Palette.java has the
# argument in full.

# --- The flight HUD ------------------------------------------------------------------------------
# Action bar. Two fields: the race clock and the ring counter. <arg:1> arrives already coloured,
# because its colour is state (it flashes on a ring pass) rather than layout, and <arg:3> is a run of
# spaces the width of the clock — with it, the counter sits on the screen's centreline instead of the
# gap between the two fields doing so.
voyager.hud.flight=<c-dim><arg:0>   <arg:1>/<arg:2>   <arg:3>

# Boss bar. Fill is rings passed; colour is the band below; this is the band and the time left in it.
voyager.hud.bossbar=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3> <arg:4>
voyager.hud.bossbar.last=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3>

# --- The start -----------------------------------------------------------------------------------
voyager.countdown.digit=<c-caution><arg:0>
voyager.countdown.subtitle=<c-dim><arg:0> · <arg:1> rings · target <arg:2>
voyager.countdown.go=<c-speed>GO

# --- During a race -------------------------------------------------------------------------------
voyager.map.banner=<c-dim>» Map <c-value><arg:0><c-dim>/<arg:1> · <c-value><arg:2> <c-dim>— <c-value><arg:3> <c-dim>rings · target <c-value><arg:4>
voyager.race.finished=<c-ok>Finished <arg:0> in <arg:1>
voyager.race.joined.midcup=<c-dim>» A cup is running. You join at the next map.
voyager.lobby.waiting=<c-dim>Waiting for racers: <arg:0> of <arg:1> online
voyager.lobby.countdown=<c-caution>Cup starts in <arg:0> s
voyager.lobby.cancelled=<c-dim>» Start cancelled: <arg:0> of <arg:1> racers online. Waiting for more.
voyager.reset.title.outofbounds=<c-warn>Out of bounds
voyager.reset.title.landed=<c-warn>Landed
voyager.reset.target.ring=<c-dim>back to ring <c-value><arg:0>
voyager.reset.target.start=<c-dim>back to the start

# --- When a map ends -----------------------------------------------------------------------------
voyager.result.map.medal=<c-dim><arg:0> — <c-value><arg:1> <c-dim>from rings · <c-value><arg:2> <c-dim>for <arg:3> <c-dim>· <c-value><arg:4> <c-dim>for placement = <c-value><arg:5>
voyager.result.map.dnf=<c-dim><arg:0> — <c-warn>DNF<c-dim>. <c-value><arg:1> <c-dim>of <c-value><arg:2> <c-dim>rings, <c-value><arg:3> <c-dim>points.
voyager.result.map.subtitle=<c-value><arg:0>  <c-dim>·  <c-value><arg:1> <c-dim>points
voyager.result.map.subtitle.dnf=<c-value><arg:0> <c-dim>of <c-value><arg:1> <c-dim>rings  ·  <c-value><arg:2> <c-dim>points

# --- When the cup ends ---------------------------------------------------------------------------
voyager.result.cup.title=<c-speed>CUP COMPLETE
voyager.result.cup.subtitle=<c-dim>place <c-value><arg:0>  <c-dim>·  <c-value><arg:1> <c-dim>points
voyager.result.cup.heading=<c-dim>» <c-value><arg:0> <c-dim>— final standings
voyager.result.cup.row=<c-dim>  <arg:0>  <c-value><arg:1>  <c-dim>·  <c-value><arg:2> <c-dim>points  ·  <c-value><arg:3><c-dim>/<arg:4> maps  ·  best <c-value><arg:5>
voyager.result.cup.departed=<c-dim>(left)
voyager.result.cup.notime=<c-dim>—

# --- Medals --------------------------------------------------------------------------------------
voyager.medal.diamond=<m-diamond>DIAMOND
voyager.medal.gold=<m-gold>GOLD
voyager.medal.silver=<m-silver>SILVER
voyager.medal.bronze=<m-bronze>BRONZE
voyager.medal.finish=<m-finish>FINISH
voyager.medal.dnf=<c-warn>DNF

# --- Operator commands ---------------------------------------------------------------------------
voyager.command.restarted=<c-dim>Cup <c-value><arg:0> <c-dim>restarted, lobby skipped
voyager.command.skip.taken=<c-dim>Ending the current map on the next tick
voyager.command.skip.refused=<c-dim>Nothing is racing — a skip is not banked for the next map
voyager.command.reload.pending=<c-dim>Catalogue reloaded: the changed maps and cups play from the next round
voyager.command.reload.rejected=<c-dim>Reload refused, the running catalogue is unchanged: <c-value><arg:0> <c-dim>problem(s)
voyager.command.reload.failed=<c-dim>Reload failed, see the server log. The running catalogue is unchanged.
voyager.command.reload.denied=<c-dim>Reloading the catalogue needs operator level 4
voyager.command.reload.problem=<c-dim><arg:0>
voyager.command.reload.warning=<c-dim>Warning: <arg:0>
