# Voyager — the English message bundle.
#
# Placeholders are MiniMessage's <arg:0>, zero-indexed. NEVER MessageFormat's {0}: this project's
# translator has no MessageFormat path, so {0} renders as the three literal characters, in front of
# a player, forever. VoyagerTranslator refuses a value containing one at load.
#
# Colours are the palette tags <c-*> and <m-*>, defined once in Palette.java. Do not write a hex
# code here — a hex repeated across a bundle is a palette that has already drifted, and translating
# a line must not mean recolouring it.
#
# Red is not in the palette and must not be written here in any form. The course marks its own
# finish in red — ring 35 is the only one built from red concrete, red glazed terracotta and red
# nether bricks — and a racer learns that in one run at 33 blocks a second. Palette.java has the
# argument in full.

# --- The flight HUD ------------------------------------------------------------------------------
# Action bar. Two fields: the race clock and the ring counter. <arg:1> arrives already coloured,
# because its colour is state (it flashes on a ring pass) rather than layout, and <arg:3> is a run of
# spaces the width of the clock — with it, the counter sits on the screen's centreline instead of the
# gap between the two fields doing so.
voyager.hud.flight=<c-dim><arg:0>   <arg:1>/<arg:2>   <arg:3>

# Boss bar. Fill is rings passed; colour is the band below; this is the band and the time left in it.
voyager.hud.bossbar=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3> <arg:4>
voyager.hud.bossbar.last=<c-dim>Map <arg:0>/<arg:1> · <c-value><arg:2> <c-dim>· <arg:3>

# --- The start -----------------------------------------------------------------------------------
voyager.countdown.digit=<c-caution><arg:0>
voyager.countdown.subtitle=<c-dim><arg:0> · <arg:1> rings · target <arg:2>
voyager.countdown.go=<c-speed>GO
voyager.race.go.jump=<c-dim>Jump, then deploy your elytra.

