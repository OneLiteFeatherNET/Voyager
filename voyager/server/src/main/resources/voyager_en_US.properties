# Voyager — the English message bundle.
#
# Placeholders are MiniMessage's <arg:0>, zero-indexed. NEVER MessageFormat's {0}: this project's
# translator has no MessageFormat path, so {0} renders as the three literal characters, in front of
# a player, forever. VoyagerTranslator refuses a value containing one at load.
#
# Colours are the palette tags <c-*> and <m-*>, defined once in Palette.java. Do not write a hex
# code here — a hex repeated across a bundle is a palette that has already drifted, and translating
# a line must not mean recolouring it.
#
# Red is not in the palette and must not be written here in any form. The course marks its own
# finish in red — ring 35 is the only one built from red concrete, red glazed terracotta and red
# nether bricks — and a racer learns that in one run at 33 blocks a second. Palette.java has the
# argument in full.

# --- The flight HUD ------------------------------------------------------------------------------
# Action bar. Two labelled fields: the race clock and the ring counter. The clock is coloured here, by the
# tag. <arg:1> arrives already coloured, because its colour is state (it flashes on a ring pass) rather
# than layout, and <arg:3> is a run of spaces the width of the clock — with it, the counter sits on the
# screen's centreline instead of the gap between the two fields doing so.
voyager.hud.flight=<c-dim>Time <c-value><arg:0> <c-dim>· Rings <arg:1>/<arg:2>   <arg:3>

# Boss bar. Fill is rings passed and colour is fixed; the title names the map, and <arg:3> is the medal
# band with the time left in it, coloured with that band (voyager.hud.medal.left). The .last form has
# no countdown, so its <arg:3> is the tier name alone.
voyager.hud.bossbar=<c-dim>Map <arg:0>/<arg:1> · <arg:2> · </c-dim><arg:3>
voyager.hud.bossbar.last=<c-dim>Map <arg:0>/<arg:1> · <arg:2> · </c-dim><arg:3>
voyager.hud.medal.left=<arg:0> · <arg:1> s left
voyager.hud.medal.last=<arg:0>
voyager.hud.tier.diamond=Diamond
voyager.hud.tier.gold=Gold
voyager.hud.tier.silver=Silver
voyager.hud.tier.bronze=Bronze
voyager.hud.tier.finish=Finish
voyager.hud.tier.dnf=DNF

