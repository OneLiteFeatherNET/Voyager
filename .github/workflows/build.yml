name: Build

# Pull requests are built by build-pr.yml, which calls the shared org workflow and produces job
# names identical to this one's — "Build on <os>". Running both meant nine build jobs per pull
# request instead of three. This one keeps the push trigger so a branch, and main after a merge,
# still gets built; the required status checks on main are satisfied by build-pr.yml on the pull
# request itself. Both must keep producing the same job names: the ruleset main-branch-protection
# requires "Build on ubuntu-latest", "Build on windows-latest" and "Build on macos-latest" by name,
# so renaming either job blocks every pull request.
on:
  push:
    branches: ['**']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew build -x test
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}

      - name: Test
        run: ./gradlew test
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: '**/build/reports/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Shadow JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shadow-jar
          path: server/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
