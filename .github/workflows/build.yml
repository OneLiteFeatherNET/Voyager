name: Build

# This workflow used to trigger on both `push: '**'` and `pull_request: '**'`, so every push to a
# pull request's branch ran it twice — six jobs where three were meant, on top of the three that
# build-pr.yml contributes through the shared org workflow. Nine per pull request.
#
# Now: pull requests are covered by the `pull_request` trigger here, which is also what satisfies
# the ruleset main-branch-protection — it requires "Build on ubuntu-latest", "Build on
# windows-latest" and "Build on macos-latest" by name, and those names come from this file's
# matrix. Renaming that job blocks every pull request. The `push` trigger is narrowed to `main`, so
# a merge is still built without duplicating the branch's own pull-request run.
#
# build-pr.yml produces differently named jobs (`build / Build (<os>)`) through the shared workflow
# and is not what the ruleset watches.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew build -x test
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}

      - name: Test
        run: ./gradlew test
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: '**/build/reports/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Shadow JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shadow-jar
          path: server/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
