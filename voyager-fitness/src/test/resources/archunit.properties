# Frozen architecture baseline of the slice-boundary rules (design D2 and D3 of freeze-slice-boundary-violations).
# The path is relative to the test working directory, which voyager-fitness/build.gradle.kts pins to the module.
# Locally, a developer may create and shrink the store. On CI (CI=true) the build turns both off with system
# properties, so a baseline cannot be written during a CI run.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
